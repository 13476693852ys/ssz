<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>赛程记分 | 麻城二中80周年校庆</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Microsoft Yahei", sans-serif;
      }
      body {
        background: url("https://pic2.zhimg.com/v2-a53c740141ab75eb4fe16af3ef8c35c5_r.jpg")
          no-repeat center;
        background-size: cover;
        min-height: 100vh;
        padding: 30px;
      }
      nav {
        display: flex;
        justify-content: center;
        gap: 24px;
        margin-bottom: 40px;
      }
      nav a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        padding: 8px 16px;
        border-radius: 20px;
      }
      nav a:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .container {
        width: 90%;
        max-width: 1000px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        border-radius: 24px;
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
      }
      h1 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 20px;
        text-shadow: 0 0 8px #0003;
      }
      .match-select-area {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 25px;
      }
      .match-tag {
        padding: 8px 14px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        cursor: pointer;
      }
      .match-tag.active {
        background: #36e8e8;
        color: #003333;
        font-weight: bold;
      }
      .match-info {
        text-align: center;
        font-size: 20px;
        margin-bottom: 25px;
      }
      .score-board {
        display: flex;
        justify-content: space-around;
        align-items: center;
        margin: 40px 0;
      }
      .team {
        text-align: center;
      }
      .team h3 {
        font-size: 24px;
        margin-bottom: 12px;
      }
      .score-num {
        font-size: 72px;
        font-weight: bold;
        color: #36e8e8;
        text-shadow: 0 0 6px #00cccc70;
      }
      .btn-group {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        cursor: pointer;
        background: #36e8e8;
        color: #003333;
        font-weight: bold;
      }
      button:hover {
        background: #20d0d0;
      }
      .control-bar {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
        flex-wrap: wrap;
      }
      .page-footer {
        position: fixed;
        bottom: 12px;
        left: 0;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 14px;
        z-index: 999;
        background-color: rgba(255, 255, 255, 0.08);
        padding: 6px 0;
        border-radius: 8px;
        opacity: 0.6;
      }
    </style>
  </head>
  <div>
    <nav>
      <!--Middle Section-->
      <a
        class="nav-items active"
        href="https://13476693852ys.github.io/ssz/index.html"
        >Home</a
      >
      <a class="nav-items" href="https://13476693852ys.github.io/ssz/Query.html"
        >Query</a
      >
      <a class="nav-items" href="https://13476693852ys.github.io/ssz/VOTE.html"
        >Vote</a
      >
      <a
        class="nav-items"
        href="https://13476693852ys.github.io/ssz/Match%20Scoreboard.html"
        >Match Scoreboard</a
      >
    </nav>
    <div class="container">
      <h1>🏆 校庆赛事记分台</h1>
      <div class="match-select-area" id="matchSelectBox">
        <!-- 赛程标签JS动态渲染 -->
      </div>
      <div class="match-info">
        <p>赛事：麻城二中80周年校庆文体赛</p>
        <p id="currentMatchName">当前比赛：比赛 1</p>
      </div>
      <div class="score-board">
        <div class="team">
          <input
            type="text"
            id="teamAName"
            placeholder="输入A队名称"
            onchange="saveTeamName()"
          />
          <div class="score-num" id="scoreA">0</div>
          <div class="btn-group">
            <button onclick="addA()">+1</button>
            <button onclick="subA()">-1</button>
          </div>
        </div>
        <div class="vs">VS</div>
        <div class="team">
          <input
            type="text"
            id="teamBName"
            placeholder="输入B队名称"
            onchange="saveTeamName()"
          />
          <div class="score-num" id="scoreB">0</div>
          <div class="btn-group">
            <button onclick="addB()">+1</button>
            <button onclick="subB()">-1</button>
          </div>
        </div>
      </div>
      <div class="control-bar">
        <button onclick="resetAll()">🔄 重置本场比分</button>
        <button onclick="createNewMatch()">➕ 新建比赛</button>
      </div>
    </div>
    <div class="page-footer">献礼麻城二中80周年校庆 | 网页制作：杨烁</div>
    <script>
      let matchList = JSON.parse(localStorage.getItem("matchList")) || [
        {
          name: "比赛 1",
          scoreA: 0,
          scoreB: 0,
          teamA: "代表队 A",
          teamA: "代表队 B",
        },
      ];
      let currentIndex = Number(localStorage.getItem("currentIndex")) || 0;

      const elA = document.getElementById("scoreA");
      const elB = document.getElementById("scoreB");
      const teamAInput = document.getElementById("teamAName");
      const teamBInput = document.getElementById("teamBName");
      const matchSelectBox = document.getElementById("matchSelectBox");
      const currentMatchNameEl = document.getElementById("currentMatchName");

      //渲染全部赛程标签
      function renderMatchTags() {
        matchSelectBox.innerHTML = "";
        matchList.forEach((item, idx) => {
          const tag = document.createElement("div");
          tag.className = "match-tag " + (idx === currentIndex ? "active" : "");
          tag.innerText = item.name;
          tag.onclick = () => switchMatch(idx);
          matchSelectBox.appendChild(tag);
        });
      }

      //渲染当前比分
      function renderScore() {
        const currentMatch = matchList[currentIndex];
        elA.innerText = currentMatch.scoreA;
        elB.innerText = currentMatch.scoreB;
        teamAInput.value = currentMatch.teamA;
        teamBInput.value = currentMatch.teamB;
        currentMatchNameEl.innerText = "当前比赛：" + currentMatch.name;
      }

      //保存全部数据到本地存储
      function saveAllData() {
        localStorage.setItem("matchList", JSON.stringify(matchList));
        localStorage.setItem("currentIndex", currentIndex);
      }

      //保存修改后的队伍名称
      function swichMatch(idx) {
        currentIndex = idx;
        saveALLData();
        renderMatchTags();
        renderScore();
      }

      //切换赛程
      function createNewMatch() {
        const newName = "比赛" + (matchList.length + 1);
        matchList.push({ name: newName, scoreA: 0, scoreB: 0, teamA: "" });
        saveAllData();
        renderMatchTags();
        renderScore();
      }

      //新建赛程
      function createNewMatch() {
        const newName = "比赛 " + (matchList.length + 1);
        matchList.push({
          name: newName,
          scoreA: 0,
          scoreB: 0,
          teamA: "代表队 A",
          teamB: "代表队 B",
        });
        saveAllData();
        renderMatchTags();
        renderScore();
      }

      function addA() {
        matchList[currentIndex].scoreA++;
        renderScore();
        saveAllData();
      }
      function subA() {
        if (matchList[currentIndex].scoreA > 0) {
          matchList[currentIndex].scoreA--;
          renderScore();
          saveAllData();
        }
      }
      function addB() {
        matchList[currentIndex].scoreB++;
        renderScore();
        saveAllData();
      }
      function subB() {
        if (matchList[currentIndex].scoreB > 0) {
          matchList[currentIndex].scoreB--;
          renderScore();
          saveAllData();
        }
      }
      function resetAll() {
        matchList[currentIndex].scoreA = 0;
        matchList[currentIndex].scoreB = 0;
        renderScore();
        saveAllData();
      }

      //页面初始化渲染
      renderMatchTags();
      renderScore();
    </script>
  </body>
</html>
