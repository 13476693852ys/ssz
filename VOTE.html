<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>校庆作品投票 | 麻城二中80周年</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Fredoka", "Microsoft Yahei", sans-serif;
      }
      body {
        background: url("https://pic2.zhimg.com/v2-a53c740141ab75eb4fe16af3ef8c35c5_r.jpg")
          no-repeat center;
        background-size: cover;
        min-height: 100vh;
        padding: 30px;
      }
      nav {
        display: flex;
        justify-content: center;
        gap: 24px;
        margin-bottom: 40px;
        flex-wrap: wrap;
      }
      nav a {
        color: white;
        text-decoration: none;
        font-size: 18px;
        padding: 8px 16px;
        border-radius: 20px;
      }
      nav a:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      nav a.active {
        background: rgba(255, 255, 255, 0.25);
      }
      .vote-container {
        width: 90%;
        max-width: 1000px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        border-radius: 24px;
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: white;
      }
      .title {
        text-align: center;
        font-size: 36px;
        margin-bottom: 10px;
        text-shadow: 0 0 8px #0003;
      }
      .desc {
        text-align: center;
        opacity: 0.85;
        margin-bottom: 35px;
        font-size: 20px;
      }
      .vote-item {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        cursor: pointer;
        transition: 0.25s;
      }
      .vote-item:hover {
        background: rgba(255, 255, 255, 0.18);
      }
      .vote-item input[type="radio"] {
        display: none;
      }
      .radio-circle {
        width: 22px;
        height: 22px;
        border: 2px solid #ffffff;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
      }
      .radio-circle::after {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #36e8e8;
        transform: scale(0);
        transition: 0.2s;
      }
      .vote-item input[type="radio"]:checked + .radio-circle::after {
        transform: scale(1);
      }
      .vote-item input[type="radio"]:checked ~ .text {
        color: #36e8e8;
        font-weight: bold;
      }
      .vote-btn {
        display: block;
        margin: 30px auto 0;
        padding: 12px 40px;
        border: none;
        border-radius: 30px;
        background: #36e8e8;
        color: #003333;
        font-weight: bold;
        font-size: 18px;
        cursor: pointer;
      }
      .vote-btn:hover {
        background: #20d0d0;
      }
      .vote-btn:disabled {
        background: #77aaaa;
        cursor: not-allowed;
      }
      .result-box {
        margin-top: 35px;
        padding: 28px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .result-box h3 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 24px;
      }
      .result-item {
        margin-bottom: 18px;
      }
      .result-top {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 18px;
      }
      .progress-wrap {
        width: 100%;
        height: 14px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 99px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: #36e8e8;
        border-radius: 99px;
        transition: 0.4s width ease;
      }
      .toast {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        border-radius: 12px;
        color: #003333;
        font-weight: bold;
        z-index: 999;
        opacity: 0;
        transition: 0.3s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
      }
      .toast.success {
        background: #36e8e8;
      }
      .toast.error {
        background: #ff8a8a;
        color: #330000;
      }
      .toast.info {
        background: #ffe08a;
      }
      footer {
        position: fixed;
        bottom: 12px;
        left: 0;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 14px;
        padding: 6px 0;
        opacity: 0.7;
      }
      .debug-panel {
        width: 90%;
        max-width: 1000px;
        margin: 20px auto 0;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 16px;
        padding: 16px 20px;
        color: #ccc;
        font-size: 13px;
        font-family: monospace;
      }
      .debug-panel summary {
        cursor: pointer;
        color: #36e8e8;
        font-weight: bold;
        margin-bottom: 8px;
      }
      .debug-panel pre {
        white-space: pre-wrap;
        word-break: break-all;
      }
      .reset-btn {
        position: relative;
        z-index: 10;
        display: block;
        margin: 24px auto 0;
        padding: 10px 28px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 30px;
        background: transparent;
        color: #ffffff;
        font-size: 15px;
        cursor: pointer;
        transition: 0.25s;
      }
      .reset-btn:hover {
        background: rgba(255, 255, 255, 0.18);
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="https://13476693852ys.github.io/ssz/index.html">Home</a>
      <a href="https://13476693852ys.github.io/ssz/Query.html">Query</a>
      <a class="active" href="https://13476693852ys.github.io/ssz/VOTE.html"
        >Vote</a
      >
      <a href="https://13476693852ys.github.io/ssz/Match%20Scoreboard.html"
        >Match Scoreboard</a
      >
    </nav>

    <div class="vote-container">
      <h1 class="title">🏆 校庆作品投票</h1>
      <p class="desc">为麻城二中80周年校庆参赛类型投票，每人限投一票</p>
      <form id="voteForm">
        <div class="vote-item">
          <input type="radio" name="work" id="w1" value="类型1" />
          <span class="radio-circle"></span>
          <label for="w1" class="text">类型1：体艺节</label>
        </div>
        <div class="vote-item">
          <input type="radio" name="work" id="w2" value="类型2" />
          <span class="radio-circle"></span>
          <label for="w2" class="text">类型2：摄影大赛</label>
        </div>
        <div class="vote-item">
          <input type="radio" name="work" id="w3" value="类型3" />
          <span class="radio-circle"></span>
          <label for="w3" class="text">类型3：英语手抄报</label>
        </div>
        <div class="vote-item">
          <input type="radio" name="work" id="w4" value="类型4" />
          <span class="radio-circle"></span>
          <label for="w4" class="text">类型4：美术作品</label>
        </div>
        <div class="vote-item">
          <input type="radio" name="work" id="w5" value="类型5" />
          <span class="radio-circle"></span>
          <label for="w5" class="text">类型5：主持人大赛</label>
        </div>
        <div class="vote-item">
          <input type="radio" name="work" id="w6" value="类型6" />
          <span class="radio-circle"></span>
          <label for="w6" class="text">类型6：电脑作品</label>
        </div>
        <button type="submit" class="vote-btn" id="submitBtn">提交投票</button>
      </form>

      <div class="result-box">
        <h3>当前投票结果</h3>
        <div id="resultList">加载中...</div>
      </div>

      <button type="button" class="reset-btn" id="resetBtn">
        <i class="fa-solid fa-rotate-right"></i> 重置投票状态（可重新投票）
      </button>
    </div>

    <!-- 调试面板：可折叠，方便排查 -->
    <details class="debug-panel">
      <summary>🛠 调试面板（点击展开）</summary>
      <p>当前存储键：<span id="dbgKey"></span></p>
      <p>原始数据：</p>
      <pre id="dbgRaw"></pre>
      <button
        id="dbgReset"
        style="margin-top:10px;padding:6px 14px;border:none;border-radius:8px;background:#ff8a8a;color:#330000;font-weight:bold;cursor:pointer;"
      >
        清空本地投票数据 & 重置投票状态
      </button>
    </details>

    <div class="toast" id="toast"></div>
    <footer>献礼麻城二中80周年校庆 | 网页制作：杨烁</footer>

    <script>
      /* ========== 配置 ========== */
      const STORAGE_KEY = "mcez80_vote_data"; // 各类型票数
      const VOTED_KEY = "mcez80_has_voted"; // 是否已投过票
      const TYPE_KEYS = ["类型1", "类型2", "类型3", "类型4", "类型5", "类型6"];
      const NAME_MAP = {
        类型1: "类型1：体艺节",
        类型2: "类型2：摄影大赛",
        类型3: "类型3：英语手抄报",
        类型4: "类型4：美术作品",
        类型5: "类型5：主持人大赛",
        类型6: "类型6：电脑作品",
      };

      /* ========== DOM ========== */
      const form = document.getElementById("voteForm");
      const submitBtn = document.getElementById("submitBtn");
      const resultListEl = document.getElementById("resultList");
      const toastEl = document.getElementById("toast");

      /* ========== 工具函数 ========== */
      function showToast(msg, type = "info", duration = 2200) {
        toastEl.textContent = msg;
        toastEl.className = "toast show " + type;
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => {
          toastEl.className = "toast " + type;
        }, duration);
      }

      // 读取票数（纯本地，无需网络）
      function getVoteData() {
        let raw = null;
        try {
          raw = localStorage.getItem(STORAGE_KEY);
        } catch (e) {
          console.error("读取 localStorage 失败：", e);
        }
        const data = {};
        TYPE_KEYS.forEach((k) => (data[k] = 0));
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            TYPE_KEYS.forEach((k) => {
              if (typeof parsed[k] === "number") data[k] = parsed[k];
            });
          } catch (e) {
            console.warn("投票数据解析失败，将重置：", e);
          }
        }
        return data;
      }

      // 保存票数
      function saveVoteData(data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          console.error("保存 localStorage 失败：", e);
          showToast("保存失败（浏览器存储不可用）", "error");
        }
      }

      /* ========== 渲染结果 ========== */
      function renderResult(voteData) {
        const total = TYPE_KEYS.reduce((s, k) => s + (voteData[k] || 0), 0);
        resultListEl.innerHTML = "";
        TYPE_KEYS.forEach((key) => {
          const itemVotes = voteData[key] || 0;
          const percent = total === 0 ? 0 : ((itemVotes / total) * 100).toFixed(1);
          const div = document.createElement("div");
          div.className = "result-item";
          div.innerHTML = `
            <div class="result-top">
              <span>${NAME_MAP[key]}</span>
              <span>${itemVotes} 票（${percent}%）</span>
            </div>
            <div class="progress-wrap">
              <div class="progress-bar" style="width:${percent}%"></div>
            </div>
          `;
          resultListEl.appendChild(div);
        });
      }

      // 加载并渲染（这里不会失败，纯本地）
      function loadVoteResult() {
        try {
          const data = getVoteData();
          renderResult(data);
          updateDebug(data);
        } catch (e) {
          resultListEl.innerHTML =
            "<p style='text-align:center;color:#ffdddd'>读取投票数据失败</p>";
          console.error("读取票数错误：", e);
        }
      }

      /* ========== 调试面板 ========== */
      function updateDebug(data) {
        document.getElementById("dbgKey").textContent = STORAGE_KEY;
        document.getElementById("dbgRaw").textContent = JSON.stringify(
          data,
          null,
          2
        );
      }

      // 执行重置（清空票数 + 允许重新投票），供多个按钮复用
      function doReset() {
        try {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(VOTED_KEY);
        } catch (e) {}
        hasVoted = false;
        submitBtn.disabled = false;
        submitBtn.innerText = "提交投票";
        loadVoteResult();
        showToast("已重置，可以重新投票", "success");
      }

      document.getElementById("dbgReset").addEventListener("click", () => {
        if (!confirm("确定要清空本地投票数据并允许重新投票吗？")) return;
        doReset();
      });

      // 主界面的重置按钮
      document.getElementById("resetBtn").addEventListener("click", () => {
        if (
          !confirm(
            "确定要重置投票状态吗？重置后你可以重新投一票（所有人的票数也会被清空）。"
          )
        )
          return;
        doReset();
      });

      /* ========== 初始化状态 ========== */
      let hasVoted = false;
      try {
        hasVoted = localStorage.getItem(VOTED_KEY) === "true";
      } catch (e) {}

      loadVoteResult();

      if (hasVoted) {
        submitBtn.disabled = true;
        submitBtn.innerText = "您已完成投票";
      }

      /* ========== 提交投票 ========== */
      form.addEventListener("submit", function (e) {
        e.preventDefault();

        if (hasVoted) {
          showToast("您已经投过票了，每人限投一票", "info");
          return;
        }

        const selected = document.querySelector('input[name="work"]:checked');
        if (!selected) {
          showToast("请选择一个作品再投票！", "info");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "提交中...";

        // 模拟一点提交延迟，体验更真实（纯本地，无需网络）
        setTimeout(() => {
          try {
            const data = getVoteData();
            data[selected.value] = (data[selected.value] || 0) + 1;
            saveVoteData(data);

            hasVoted = true;
            try {
              localStorage.setItem(VOTED_KEY, "true");
            } catch (e) {}

            showToast("投票成功！你选择了：" + selected.value, "success");
            form.reset();
            submitBtn.innerText = "您已完成投票";
            renderResult(data);
            updateDebug(data);
          } catch (err) {
            // 纯本地操作几乎不会失败，这里保留兜底提示
            showToast("提交失败：" + (err && err.message ? err.message : "未知错误"), "error");
            submitBtn.disabled = false;
            submitBtn.innerText = "提交投票";
            console.error("投票错误：", err);
          }
        }, 300);
      });
    </script>
  </body>
</html>
